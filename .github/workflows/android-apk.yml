name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Censorship-Directorate-Android-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish Android preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Censorship-Directorate-Android-Preview.apk
          TAG="v0.2.0-android-preview"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Censorship-Directorate-Android-Preview.apk --clobber
          else
            gh release create "$TAG" Censorship-Directorate-Android-Preview.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "Censorship Directorate Android preview" \
              --notes "Android native preview. Mouth/face tracking, microphone sound activity and local alarm tone. Hand-cover tracking and system-wide virtual microphone routing are not yet supported. Debug-signed APK: future builds may need a reinstall."
          fi
